apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: studiopulse-web
  labels:
    cloud.googleapis.com/location: us-central1
    app: studiopulse-web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/studiopulse-web:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_AGENT_API_URL
              value: "https://studiopulse-agent-hash-uc.a.run.app"
